<svg xmlns="http://www.w3.org/2000/svg" width="600" height="210" viewBox="0 0 600 210" role="img" aria-label="md2wechat，Agent 公众号发布引擎">
  <title>md2wechat</title>
  <desc>把 Markdown 内容变成可发布、可预览、可复用的公众号作品。</desc>
  <style>
    .sans { font-family: Inter, Arial, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
  </style>
  <rect width="600" height="210" rx="14" fill="#070707"/>
  <rect x="1" y="1" width="598" height="208" rx="13" fill="none" stroke="#2A2318"/>
  <line x1="3" y1="16" x2="3" y2="194" stroke="#C6A15B" stroke-width="3"/>
  <text x="28" y="32" class="mono" font-size="11" letter-spacing="1.8" fill="#C6A15B">FLAGSHIP 01</text>
  <g transform="translate(30 65)" fill="none" stroke="#C6A15B" stroke-width="2">
    <rect width="96" height="96" rx="12" stroke="#2A2318"/>
    <path d="M25 18h32l14 14v46H25z"/>
    <path d="M57 18v15h14M35 47h25M35 59h19"/>
    <path d="M67 72h17M78 66l6 6-6 6" stroke="#E2C27A"/>
  </g>
  <g transform="translate(158 68)">
    <text class="sans" font-size="30" font-weight="600" fill="#EFE7DA">md2wechat</text>
    <text y="34" class="sans" font-size="18" fill="#C6A15B">Agent 公众号发布引擎</text>
    <line y1="59" x2="402" y2="59" stroke="#2A2318"/>
    <text y="86" class="sans" font-size="15" fill="#9B9181">把 Markdown 内容变成可发布、可预览、</text>
    <text y="109" class="sans" font-size="15" fill="#9B9181">可复用的公众号作品。</text>
  </g>
</svg>
